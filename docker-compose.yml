version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cabbooking_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cabbooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cabbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cabbooking
      dockerfile: Dockerfile
    container_name: cabbooking_backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/cabbooking
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cabbooking_frontend
    restart: always
    ports:
      - "80:80"

volumes:
  pgdata:
